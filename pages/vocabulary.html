<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelime Bilgisi — Erasmus Hazirlik</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="header">
    <div class="header-content">
      <a href="../index.html" class="back-btn">← Geri</a>
      <h1>Kelime Bilgisi</h1>
      <span class="header-level" id="header-level">A2</span>
    </div>
  </div>

  <div class="container">

    <div class="tabs">
      <button class="tab-btn active" onclick="showVocabTab('themes')">Temalar</button>
      <button class="tab-btn" onclick="showVocabTab('quiz')">Quiz</button>
    </div>

    <div class="info-banner">
      Kelime bilgisi grammar soruların icinde de cikar. Ozellikle saglik terimleri onemli!
    </div>

    <!-- Theme List -->
    <div id="tab-themes">
      <div class="topic-list" id="vocab-list"></div>
    </div>

    <!-- Quiz -->
    <div id="tab-vocab-quiz" style="display:none">
      <div id="quiz-area">
        <div class="empty-state">
          <div class="empty-icon">📚</div>
          <p>Bir tema secin</p>
        </div>
      </div>
    </div>

  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/adaptive-engine.js"></script>
  <script src="../js/quiz-engine.js"></script>
  <script src="../js/teach-engine.js"></script>
  <script src="../js/error-journal.js"></script>
  <script src="../js/daily-report.js"></script>
  <script src="../js/timer.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.getElementById('header-level').textContent = Storage.getLevel();

    const vocabThemes = [
      { id: 'health-medicine', name: 'Saglik & Tip', desc: 'patient, diagnosis, treatment, surgery...', icon: '🏥' },
      { id: 'education-academic', name: 'Egitim & Akademik', desc: 'scholarship, semester, thesis, faculty...', icon: '🎓' },
      { id: 'daily-life', name: 'Gunluk Yasam', desc: 'routine, shopping, weather, transport...', icon: '🏠' },
      { id: 'environment', name: 'Cevre', desc: 'pollution, recycle, climate, ecosystem...', icon: '🌍' },
      { id: 'technology', name: 'Teknoloji', desc: 'software, AI, digital, cybersecurity...', icon: '💻' },
      { id: 'travel-tourism', name: 'Seyahat & Turizm', desc: 'airport, booking, passport, customs...', icon: '✈️' },
      { id: 'work-career', name: 'Is & Kariyer', desc: 'resume, interview, salary, promotion...', icon: '💼' },
      { id: 'common-words', name: 'Sik Kullanilan Kelimeler', desc: 'however, therefore, significant...', icon: '📖' },
    ];

    function renderVocabList() {
      const list = document.getElementById('vocab-list');
      list.innerHTML = vocabThemes.map(t => {
        const stat = Storage.getTopicStat('vocab-' + t.id);
        const accuracy = stat.total > 0 ? Math.round((stat.correct / stat.total) * 100) : 0;
        return `
          <div class="topic-item" onclick="startVocabQuiz('${t.id}')">
            <div>
              <div class="topic-name">${t.icon} ${t.name}</div>
              <div class="topic-stats">${t.desc}</div>
              ${stat.total > 0 ? `<div class="topic-stats">%${accuracy} dogru (${stat.total} soru)</div>` : ''}
            </div>
            <span style="font-size:1.2rem">→</span>
          </div>
        `;
      }).join('');
    }

    async function startVocabQuiz(themeId) {
      showVocabTab('quiz');
      const quizArea = document.getElementById('quiz-area');
      quizArea.innerHTML = '<div class="empty-state"><p>Sorular yukleniyor...</p></div>';

      try {
        const questions = await QuizEngine.loadQuestions(`../data/vocabulary/${themeId}.json`);
        if (questions.length === 0) {
          quizArea.innerHTML = '<div class="warning-banner">Bu tema icin henuz soru yuklenmedi.</div>';
          return;
        }
        const selected = AdaptiveEngine.selectQuestions(questions, 'vocab-' + themeId, 10);
        QuizEngine.start(selected, 'vocab-' + themeId, 'quiz');
      } catch (err) {
        quizArea.innerHTML = '<div class="warning-banner">Sorular yuklenirken hata olustu.</div>';
        console.error(err);
      }
    }

    function showVocabTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', ['themes', 'quiz'][i] === tab);
      });
      document.getElementById('tab-themes').style.display = tab === 'themes' ? 'block' : 'none';
      document.getElementById('tab-vocab-quiz').style.display = tab === 'quiz' ? 'block' : 'none';
    }

    renderVocabList();
  </script>

</body>
</html>
